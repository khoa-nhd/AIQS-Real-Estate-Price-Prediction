<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ước tính giá nhà</title>
<meta name="description" content="Ước tính giá nhà ở Việt Nam bằng mô hình XGBoost + LightGBM của dự án AIQS. Mô hình chạy ngay trong trình duyệt.">
<meta name="theme-color" content="#030208">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23151329'/%3E%3Cpath d='M8 16 16 9l8 7v8h-5v-5h-6v5H8z' fill='%2351FAAA'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=check_circle,cloud_off,error,info,lock,refresh,undo,warning&display=block">
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body class="is-loading">
<div class="page" id="app">
  <nav class="tabs" role="tablist" aria-label="Các trang">
    <button type="button" role="tab" id="tab-uoc-tinh" aria-controls="view-uoc-tinh" aria-selected="true">Ước tính giá</button>
    <button type="button" role="tab" id="tab-do-chinh-xac" aria-controls="view-do-chinh-xac" aria-selected="false" tabindex="-1">Độ chính xác của mô hình</button>
    <button type="button" role="tab" id="tab-du-lieu" aria-controls="view-du-lieu" aria-selected="false" tabindex="-1">Dữ liệu và giới hạn</button>
  </nav>

  <section id="view-uoc-tinh" role="tabpanel" aria-labelledby="tab-uoc-tinh">
    <div class="banner banner--unavailable" id="banner" role="status" hidden></div>
    <header class="head"><h1 class="h1">Ước tính giá nhà</h1><p class="lead">Đang tải…</p></header>
    <div class="split">
      <form class="panel panel--form" id="form" novalidate>
        <div class="summary" id="error-summary" role="alert" tabindex="-1" hidden></div>
        <div id="fields"></div>
        <p class="help" id="legend"></p>
        <div class="ring" id="ring"></div>
        <div class="actions">
          <button type="submit" class="btn-primary" id="submit" disabled>Đang nạp mô hình…</button>
          <button type="button" class="btn-link" id="reset">Xoá thông tin đã nhập</button>
        </div>
        <p class="help blocked" id="blocked" hidden></p>
      </form>
      <div class="result-column">
        <section class="panel panel--result panel--initial" id="result" aria-live="off"></section>
        <section class="panel panel--recap" id="recap" hidden></section>
      </div>
    </div>
  </section>

  <section id="view-do-chinh-xac" role="tabpanel" aria-labelledby="tab-do-chinh-xac" hidden></section>
  <section id="view-du-lieu" role="tabpanel" aria-labelledby="tab-du-lieu" hidden></section>

  <footer class="footer"><p class="small" id="privacy"></p></footer>
</div>
<div class="sr-only" id="announcer" aria-live="polite"></div>
<noscript><p class="noscript">Trang cần JavaScript để chạy mô hình ước tính giá.</p></noscript>
</body>
</html>
